function renderEditTagList(){
  const body = document.getElementById("editTagListBody");
  if (!body) return;
  body.innerHTML = "";
  const q = state.filters.search.trim().toLowerCase();
  let cards = CARDS;
  if (q){
    cards = cards.filter(c=>{
      const eff = getEffectiveCard(c);
      const collNames = effectiveCardCollectionIds(c).map(collectionLabel).join(" ");
      const hay = [eff.reference, allTextForSearch(c), eff.topic, eff.citation, getTags(c).join(" "), collNames]
        .filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  if (!cards.length){ body.appendChild(el(`<div class="emptystate">No matches.</div>`)); return; }

  if (editTagSort === "collection"){
    cards = cards.slice().sort((a,b)=>{
      const la = collectionLabel(effectiveCardCollectionIds(a)[0]);
      const lb = collectionLabel(effectiveCardCollectionIds(b)[0]);
      return la.localeCompare(lb) || 0;
    });
  } else if (editTagSort === "recent"){
    cards = cards.slice().sort((a,b)=> cardCreatedAt(b) - cardCreatedAt(a));
  }

  let lastGroup = null;
  cards.forEach(c=>{
    if (editTagSort === "collection"){
      const groupLabel = collectionLabel(effectiveCardCollectionIds(c)[0]);
      if (groupLabel !== lastGroup){
        lastGroup = groupLabel;
        body.appendChild(el(`<div class="footnote" style="margin:12px 0 2px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">${esc(groupLabel)}</div>`));
      }
    }
    const eff = getEffectiveCard(c);
    const p = getProg(c.id);
    const dotClass = p.seen===0 ? "new" : (p.lastResult==="wrong" ? "bad" : "good");
    const verLabel = c.type==="verse" ? (currentVersion(c) || "") : "";
    const collNames = effectiveCardCollectionIds(c).map(collectionLabel).join(" · ");
    const recentNote = editTagSort === "recent" && c.createdAt ? " · " + relativeDateLabel(c.createdAt) : "";
    const row = el(`<div class="cardlistrow" style="cursor:pointer;">
        <input type="checkbox" class="bulkCheck">
        <span class="dot ${dotClass}"></span>
        <div class="clr-main">
          <div class="clr-ref">${esc(eff.reference || TYPE_LABELS[eff.type])}${verLabel?` <span class="footnote">(${esc(verLabel)})</span>`:""}${isEdited(c.id)?' <span class="footnote">· edited</span>':""}${isUserAdded(c.id)?' <span class="footnote">· added by you</span>':""}</div>
          <div class="clr-topic">${esc(collNames)}${eff.topic? " · "+esc(eff.topic) : ""}${p.seen? " · seen "+p.seen+"x":""}${recentNote}</div>
          <div class="clr-tags"></div>
        </div>
      </div>`);
    const checkbox = row.querySelector(".bulkCheck");
    checkbox.checked = editTagSelected.has(c.id);
    checkbox.addEventListener("click", (e)=> e.stopPropagation());
    checkbox.addEventListener("change", (e)=>{
      if (e.target.checked) editTagSelected.add(c.id); else editTagSelected.delete(c.id);
      renderEditTagBulkBar();
    });
    const tagWrap = row.querySelector(".clr-tags");
    getTags(c).forEach(t=> tagWrap.appendChild(el(`<span class="taglabel">${esc(t)}</span>`)));
    row.addEventListener("click", (e)=>{ if (e.target === checkbox) return; openCardDetail(c); });
    body.appendChild(row);
  });
}

function openCardDetail(card, opts){
  opts = opts || {};
  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;"></div>`);
  const sheet = el(`<div style="background:var(--surface);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));"></div>`);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  let editing = !!opts.startEditing;

  function closeSheet(){
    overlay.remove();
    renderEditTagList();
    if (typeof opts.onClose === "function") opts.onClose();
  }
  overlay.addEventListener("click", (e)=>{ if (e.target===overlay) closeSheet(); });

  function draw(){
    sheet.innerHTML = "";
    sheet.appendChild(el(`<div style="width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px;"></div>`));
    if (editing) drawEditMode(); else drawViewMode();
  }

  function drawViewMode(){
    const eff = getEffectiveCard(card);
    sheet.appendChild(el(`<div class="fc-kicker">${esc(effectiveCardCollectionIds(card).map(collectionLabel).join(" · "))}${eff.topic? " · "+esc(eff.topic):""}</div>`));
    sheet.appendChild(el(`<div class="fc-ref" style="text-align:left;">${esc(eff.reference || TYPE_LABELS[eff.type])}</div>`));

    if (eff.type === "verse" && eff.translations && eff.translations.length){
      const ver = currentVersion(card);
      const found = eff.translations.find(t=>t.version===ver) || eff.translations[0];
      sheet.appendChild(el(`<div class="fc-text" style="text-align:left;font-size:16px;margin-top:10px;">${esc(found.text)}</div>`));
      if (eff.translations.length > 1){
        const vsWrap = el(`<div class="chiprow" style="margin-top:10px;"></div>`);
        eff.translations.forEach(t=>{
          const chip = el(`<div class="chip ${t.version===ver?"on":""}">${esc(t.version)}${t.version===eff.defaultVersion?" <small>★</small>":""}</div>`);
          chip.addEventListener("click", ()=>{ tempVersion[card.id] = t.version; draw(); });
          vsWrap.appendChild(chip);
        });
        sheet.appendChild(vsWrap);
        sheet.appendChild(el(`<div class="footnote" style="margin-top:4px;">★ = your default for quizzing. Tap a version to preview it here.</div>`));
      } else {
        sheet.appendChild(el(`<div class="footnote" style="margin-top:6px;">Version: ${esc(eff.translations[0].version)}</div>`));
      }
    } else {
      sheet.appendChild(el(`<div class="fc-text" style="text-align:left;font-size:16px;margin-top:10px;">${esc(eff.text)}</div>`));
    }
    if (eff.citation) sheet.appendChild(el(`<div class="footnote" style="margin-top:8px;">${esc(eff.citation)}</div>`));

    const p = getProg(card.id);
    sheet.appendChild(el(`<div class="footnote" style="margin-top:14px;">Seen ${p.seen}x · ${p.correct} correct · ${p.wrong} wrong${p.lastSeenAt? " · last studied " + new Date(p.lastSeenAt).toLocaleDateString(): ""}</div>`));

    const collSec = el(`<div class="browsedetail"></div>`);
    collSec.appendChild(el(`<div class="footnote" style="margin-top:14px;margin-bottom:6px;">Collections</div>`));
    const collWrap = el(`<div class="chiprow" id="detailCollWrap"></div>`);
    function drawCollChips(){
      collWrap.innerHTML = "";
      const assigned = new Set(rawCardCollectionIds(card));
      if (!collections.length){
        collWrap.appendChild(el(`<div class="footnote">No collections yet — add one from Study &gt; Manage.</div>`));
        return;
      }
      collections.forEach(coll=>{
        const on = assigned.has(coll.id);
        const chip = el(`<div class="chip ${on?"on":""}">${esc(coll.name)}</div>`);
        chip.addEventListener("click", ()=>{
          const cur = new Set(rawCardCollectionIds(card));
          if (cur.has(coll.id)) cur.delete(coll.id); else cur.add(coll.id);
          setCardCollections(card.id, Array.from(cur));
          drawCollChips();
        });
        collWrap.appendChild(chip);
      });
    }
    drawCollChips();
    collSec.appendChild(collWrap);
    collSec.appendChild(el(`<div class="footnote" style="margin-top:6px;">Tap to assign this verse to one or more collections. Unassigned verses show as Uncategorized.</div>`));
    sheet.appendChild(collSec);

    const tagSec = el(`<div class="browsedetail"></div>`);
    tagSec.appendChild(el(`<div class="footnote" style="margin-top:14px;margin-bottom:6px;">Tags</div>`));
    const tagWrap = el(`<div class="chiprow" id="detailTagWrap"></div>`);
    function drawTags(){
      tagWrap.innerHTML = "";
      getTags(card).forEach(t=>{
        const chip = el(`<div class="chip on">${esc(t)} <small>✕</small></div>`);
        chip.addEventListener("click", ()=>{
          const cur = getTags(card).filter(x=>x!==t);
          setTags(card.id, cur);
          drawTags();
        });
        tagWrap.appendChild(chip);
      });
    }
    drawTags();
    tagSec.appendChild(tagWrap);
    const addRow = el(`<div class="tageditrow">
        <input type="text" placeholder="Add tag(s), comma separated" id="newTagInput">
        <button class="smallghost" id="addTagBtn">Add</button>
      </div>`);
    addRow.querySelector("#addTagBtn").addEventListener("click", ()=>{
      const inp = addRow.querySelector("#newTagInput");
      const raw = inp.value.trim();
      if (!raw) return;
      const additions = raw.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
      const cur = new Set(getTags(card));
      additions.forEach(a=>cur.add(a));
      setTags(card.id, Array.from(cur));
      inp.value = "";
      drawTags();
    });
    tagSec.appendChild(addRow);
    sheet.appendChild(tagSec);

    const editBtn = el(`<button class="bigbtn ghost" style="margin-top:16px;">✏️ Edit this card</button>`);
    editBtn.addEventListener("click", ()=>{ editing = true; draw(); });
    sheet.appendChild(editBtn);

    if (p.seen > 0){
      const resetBtn = el(`<button class="linkbtn" style="margin-top:10px;">Reset stats for this card</button>`);
      resetBtn.addEventListener("click", ()=>{
        delete progress[card.id];
        saveProgress();
        draw();
      });
      sheet.appendChild(resetBtn);
    }

    if (isUserAdded(card.id)){
      const deleteBtn = el(`<button class="linkbtn" style="margin-top:10px;color:var(--bad);">🗑️ Delete this verse</button>`);
      deleteBtn.addEventListener("click", ()=>{
        if (confirm(`Delete "${eff.reference || "this verse"}"? This can't be undone.`)){
          deleteUserCard(card.id);
          overlay.remove();
          renderEditTagList();
          if (typeof opts.onClose === "function") opts.onClose();
        }
      });
      sheet.appendChild(deleteBtn);
    }

    const closeBtn = el(`<button class="bigbtn ghost" style="margin-top:10px;">Close</button>`);
    closeBtn.addEventListener("click", closeSheet);
    sheet.appendChild(closeBtn);
  }

  function drawEditMode(){
    const eff = getEffectiveCard(card);
    sheet.appendChild(el(`<div class="footnote" style="margin-bottom:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;">Editing · ${esc(effectiveCardCollectionIds(card).map(collectionLabel).join(", "))}</div>`));

    const refLabel = eff.type === "verse" ? "Reference" : "Title";
    sheet.appendChild(el(`<div class="footnote" style="margin-bottom:4px;">${refLabel}</div>`));
    const refInput = el(`<input type="text" id="editRef">`);
    refInput.value = eff.reference || "";
    sheet.appendChild(refInput);

    sheet.appendChild(el(`<div class="footnote" style="margin:10px 0 4px;">Topic / session label (optional)</div>`));
    const topicInput = el(`<input type="text" id="editTopic">`);
    topicInput.value = eff.topic || "";
    sheet.appendChild(topicInput);

    let citationInput = null;
    if (eff.type === "commitment" || eff.citation){
      sheet.appendChild(el(`<div class="footnote" style="margin:10px 0 4px;">Citation (optional)</div>`));
      citationInput = el(`<input type="text" id="editCitation">`);
      citationInput.value = eff.citation || "";
      sheet.appendChild(citationInput);
    }

    let translationRows = [];
    let plainTextArea = null;

    if (eff.type === "verse"){
      sheet.appendChild(el(`<div class="footnote" style="margin:14px 0 6px;font-weight:700;">Translations</div>`));
      const transWrap = el(`<div id="transWrap"></div>`);
      sheet.appendChild(transWrap);

      const source = (eff.translations && eff.translations.length) ? eff.translations : [{version:"NIV", text:""}];
      let defaultVer = eff.defaultVersion || source[0].version;

      function drawTranslationRows(){
        transWrap.innerHTML = "";
        translationRows = [];
        source.forEach((t, i)=>{
          const row = el(`<div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;"></div>`);
          const headRow = el(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"></div>`);
          const verInput = el(`<input type="text" placeholder="Version (e.g. NIV, ESV, KJV)" style="flex:1;">`);
          verInput.value = t.version || "";
          const defRadio = el(`<label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-dim);white-space:nowrap;"><input type="radio" name="defaultVer" ${t.version===defaultVer?"checked":""}> Default</label>`);
          defRadio.querySelector("input").addEventListener("change", ()=>{ defaultVer = verInput.value.trim() || t.version; });
          verInput.addEventListener("input", ()=>{
            // keep default radio tracking the (possibly renamed) version live
            if (defRadio.querySelector("input").checked) defaultVer = verInput.value.trim();
          });
          headRow.appendChild(verInput);
          headRow.appendChild(defRadio);
          if (source.length > 1){
            const delBtn = el(`<button class="smallghost" type="button">✕</button>`);
            delBtn.addEventListener("click", ()=>{ source.splice(i,1); drawTranslationRows(); });
            headRow.appendChild(delBtn);
          }
          row.appendChild(headRow);
          const textArea = el(`<textarea rows="4" style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--serif);font-size:14.5px;"></textarea>`);
          textArea.value = t.text || "";
          row.appendChild(textArea);
          transWrap.appendChild(row);
          translationRows.push({verInput, textArea, radio: defRadio.querySelector("input"), origVersion: t.version});
        });
      }
      drawTranslationRows();

      const addVerBtn = el(`<button class="linkbtn" style="margin-bottom:10px;">+ Add another translation</button>`);
      addVerBtn.addEventListener("click", ()=>{
        source.push({version:"", text:""});
        drawTranslationRows();
      });
      sheet.appendChild(addVerBtn);
    } else {
      sheet.appendChild(el(`<div class="footnote" style="margin:14px 0 4px;">Text</div>`));
      plainTextArea = el(`<textarea rows="6" style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--serif);font-size:14.5px;white-space:pre-line;"></textarea>`);
      plainTextArea.value = eff.text || "";
      sheet.appendChild(plainTextArea);
    }

    const saveBtn = el(`<button class="bigbtn primary" style="margin-top:14px;">Save changes</button>`);
    saveBtn.addEventListener("click", ()=>{
      const patch = {
        reference: refInput.value.trim() || null,
        topic: topicInput.value.trim() || null
      };
      if (citationInput) patch.citation = citationInput.value.trim() || null;

      if (eff.type === "verse"){
        const trans = translationRows
          .map(r=>({version: r.verInput.value.trim(), text: r.textArea.value.trim()}))
          .filter(t=>t.version && t.text);
        if (!trans.length){
          alert("Please keep at least one translation with a version name and text.");
          return;
        }
        const checkedRow = translationRows.find(r=>r.radio.checked);
        let defVer = checkedRow ? checkedRow.verInput.value.trim() : trans[0].version;
        if (!trans.some(t=>t.version===defVer)) defVer = trans[0].version;
        patch.translations = trans;
        patch.defaultVersion = defVer;
      } else {
        patch.text = plainTextArea.value;
      }

      saveCardEdit(card.id, patch);
      delete tempVersion[card.id];
      editing = false;
      draw();
    });
    sheet.appendChild(saveBtn);

    const cancelBtn = el(`<button class="bigbtn ghost" style="margin-top:8px;">Cancel</button>`);
    cancelBtn.addEventListener("click", ()=>{ editing = false; draw(); });
    sheet.appendChild(cancelBtn);

    if (isEdited(card.id)){
      const resetBtn = el(`<button class="linkbtn" style="margin-top:10px;">Undo my edits — restore original text</button>`);
      resetBtn.addEventListener("click", ()=>{
        if (confirm("Discard your edits to this card and restore the original text?")){
          resetCardEdit(card.id);
          delete tempVersion[card.id];
          editing = false;
          draw();
        }
      });
      sheet.appendChild(resetBtn);
    }
  }

  draw();
}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  const frag = document.createDocumentFragment();

  const about = el(`<div class="section">
      <h2>About this deck</h2>
      <div class="footnote">
        ${CARDS.length} cards across ${collections.length} collection${collections.length===1?"":"s"}${userCards.length? ` (${userCards.length} added by you)` : ""}.<br>
        Built ${BUILT_DATE} · v${APP_VERSION}<br><br>
        Everything you do here — progress, tags, collections, verses you've added, card edits, translation choices, custom study sets — is saved only in this browser, on this device, tied to this exact file. Keep this file where you saved it (Files app / Home Screen) rather than re-downloading a fresh copy, or your saved changes won't carry over.<br><br>
        Use Edit &amp; Tag to add your own verses, assign collections, or fix a typo. Use Browse for a clean, read-only view you can search by topic or share.
      </div>
    </div>`);
  frag.appendChild(about);

  const backup = el(`<div class="section">
      <h2>Backup your progress</h2>
      <div class="footnote" style="margin-bottom:10px;">Export a small file with your tags, collections, card edits, translations, and correct/wrong history. If you ever lose this app or your browser clears its storage, importing this file restores everything.</div>
      <div class="rowbtns">
        <button class="bigbtn ghost" id="exportBtn">Export backup</button>
      </div>
      <div style="margin-top:10px;">
        <label class="bigbtn ghost" style="display:block;text-align:center;">Import backup
          <input type="file" accept="application/json" id="importFile" style="display:none;">
        </label>
      </div>
    </div>`);
  backup.querySelector("#exportBtn").addEventListener("click", exportBackup);
  backup.querySelector("#importFile").addEventListener("change", importBackup);
  frag.appendChild(backup);

  const danger = el(`<div class="section">
      <h2>Reset</h2>
      <button class="bigbtn ghost" id="resetProgressBtn" style="color:var(--bad);">Clear all progress</button>
      <div class="footnote" style="margin-top:8px;margin-bottom:14px;">This clears correct/wrong history for every card. Your tags and edits are kept.</div>
      <button class="bigbtn ghost" id="resetEditsBtn" style="color:var(--bad);">Undo all card edits</button>
      <div class="footnote" style="margin-top:8px;">Restores every card's original reference, text, and translations. Progress and tags are kept.</div>
    </div>`);
  danger.querySelector("#resetProgressBtn").addEventListener("click", ()=>{
    if (confirm("Clear all study progress? This can't be undone (export a backup first if you want to keep it).")){
      progress = {};
      saveProgress();
      render();
    }
  });
  danger.querySelector("#resetEditsBtn").addEventListener("click", ()=>{
    if (confirm("Undo every edit you've made to card text/references/translations, restoring the originals? This can't be undone (export a backup first if you want to keep it).")){
      overrides = {};
      saveOverrides();
      render();
    }
  });
  frag.appendChild(danger);

  return frag;
}

function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    version: APP_VERSION,
    progress, tags: userTags, overrides,
    collections, cardCollections, userCards
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "verse-flashcards-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importBackup(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if (data.progress) { progress = Object.assign({}, progress, data.progress); saveProgress(); }
      if (data.tags) { userTags = Object.assign({}, userTags, data.tags); saveTags(); }
      if (data.overrides) { overrides = Object.assign({}, overrides, data.overrides); saveOverrides(); }
      if (Array.isArray(data.collections)) { collections = data.collections; saveCollections(); }
      if (data.cardCollections) { cardCollections = Object.assign({}, cardCollections, data.cardCollections); saveCardCollections(); }
      if (Array.isArray(data.userCards)) {
        data.userCards.forEach(c=>{
          if (!userCards.some(x=>x.id===c.id)){
            userCards.push(c);
            CARDS.push(c);
          }
        });
        saveUserCards();
      }
      alert("Backup imported.");
      render();
    } catch(err){
      alert("Couldn't read that file. Make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* ---------------- onboarding ---------------- */
function maybeShowOnboarding(){
  if (lsGet(LS_ONBOARDED, false)) return;
  const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;display:flex;align-items:flex-end;"></div>`);
  const sheet = el(`<div style="background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));"></div>`);
  sheet.appendChild(el(`<div style="width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px;"></div>`));
  sheet.appendChild(el(`<div class="fc-kicker" style="text-align:left;">Welcome</div>`));
  sheet.appendChild(el(`<div class="fc-ref" style="text-align:left;font-size:19px;">Four tabs, two ways to use this</div>`));
  sheet.appendChild(el(`<div class="footnote" style="margin-top:14px;line-height:1.5;">
      <b>🏠 Study</b> — pick collections and quiz yourself (or hand your phone to someone else) to memorize verses.<br><br>
      <b>📖 Browse</b> — a clean, read-only way to look verses up by collection or topic and share them — no editing.<br><br>
      <b>🏷️ Edit &amp; Tag</b> — add new verses, tag them, sort them, and manage everything.<br><br>
      <b>⚙️ Settings</b> — back up your progress, tags, and verses to a file.
    </div>`));
  const gotIt = el(`<button class="bigbtn primary" style="margin-top:18px;">Got it</button>`);
  gotIt.addEventListener("click", ()=>{ lsSet(LS_ONBOARDED, true); overlay.remove(); });
  sheet.appendChild(gotIt);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
}

/* ---------------- init ---------------- */
render();
maybeShowOnboarding();

</script>
